services:
  postgres:
    image: 'docker.io/library/postgres:18.6-trixie'
    environment:
      - 'POSTGRES_DB=taskmanager'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=taskuser'
    ports:
      - '127.0.0.1::5432'
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data: